name: Publish PyPI

# Runs when a GitHub release is published (the monorepo creates one per new version) and can be
# re-run manually if a publish failed. Publishes through PyPI trusted publishing; set the
# PYPI_TOKEN secret to publish with an API token instead.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.16"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
